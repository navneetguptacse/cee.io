name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Check formatting
        run: |
          DIFF=$(gofmt -s -l .)
          if [ -n "$DIFF" ]; then
            echo "Unformatted files found:"
            echo "$DIFF"
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: |
          go vet ./...

      - name: Run tests with race detector
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.txt ./tests/...

      - name: Build CEE binary
        run: |
          make build

      - name: Run self-diagnostics
        run: |
          ./bin/cee test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.txt
          if-no-files-found: ignore

  deploy:
    name: Deploy to EC2 Production
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.TARGET_DIR || '~/cee.io' }}"
            eval APP_DIR=$APP_DIR

            echo "Step 1: Navigating to repository at $APP_DIR"
            cd "$APP_DIR"

            echo "Step 2: Fetching and checking out latest main branch"
            git fetch origin main
            git reset --hard origin/main

            echo "Step 3: Rebuilding & restarting production containers"
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "Step 4: Cleaning up dangling images"
            docker image prune -f

            echo "Step 5: Waiting for services to initialize"
            sleep 6

            echo "Step 6: Verifying container status & health"
            docker compose -f docker-compose.prod.yml ps
            curl -s -f http://localhost/health || (echo "ERROR: Health check failed!" && exit 1)

            echo "Deployment Successful!"
