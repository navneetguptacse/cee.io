name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Optional manual tag override (leave blank to auto-detect from package.json)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Compile binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME="cee-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/${OUTPUT_NAME}" ./cmd/cee
          cd dist
          sha256sum "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cee-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag from package.json
        id: tag
        run: |
          # 1. If explicit manual override tag is passed
          if [ -n "${{ inputs.tag_override }}" ]; then
            TAG="${{ inputs.tag_override }}"
            [[ "$TAG" != v* ]] && TAG="v${TAG}"
            echo "Using manual override tag: $TAG"
          # 2. If a git tag was pushed directly
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            echo "Using pushed git tag: $TAG"
          # 3. Read version from package.json as the auto-detection source
          elif [ -f package.json ]; then
            PKG_VER=$(jq -r '.version // empty' package.json)
            if [ -n "$PKG_VER" ]; then
              TAG="v${PKG_VER}"
              echo "Auto-detected version from package.json: $TAG"
            else
              TAG="v1.0.0"
            fi
          else
            TAG="v1.0.0"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "CEE ${{ steps.tag.outputs.tag }}"
          files: release-assets/*
          generate_release_notes: true
          make_latest: true
